# Local Qdrant for VECTOR_DB=qdrant.
#
#   docker compose -f docker-compose.qdrant.yml up -d
#   docker compose -f docker-compose.qdrant.yml down          # keeps vectors
#   docker compose -f docker-compose.qdrant.yml down -v       # wipes vectors
#
# Then set in .env:
#   VECTOR_DB=qdrant
#   QDRANT_URL=http://127.0.0.1:6333
#
# Collections are created on first use, but the store starts EMPTY — run the
# embedding sync once after switching so semantic search has vectors to match
# against. Nothing is copied over from Pinecone.
#
# Dashboard: http://127.0.0.1:6333/dashboard
#
# Note: no top-level `version:` key — Compose v2 treats it as obsolete and warns.
services:
  qdrant:
    # Pinned for reproducibility. The JS client's version gate is switched off in
    # qdrant.util.js, so this can be bumped independently of the SDK.
    image: qdrant/qdrant:v1.12.4
    container_name: qdrant-local
    restart: unless-stopped
    ports:
      - '6333:6333' # REST API + dashboard
      - '6334:6334' # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      # Local dev runs unauthenticated. If you expose this past the loopback
      # interface, set QDRANT__SERVICE__API_KEY here and QDRANT_API_KEY in .env.
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      # The image ships no curl/wget, so probe with Qdrant's own binary.
      test: ['CMD', '/qdrant/qdrant', '--version']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
